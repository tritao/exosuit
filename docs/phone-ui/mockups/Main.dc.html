<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f55c7}a:hover{color:#1f3f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f5f7; color: #16181d; font-family: 'IBM Plex Sans', sans-serif;">
  <header style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #e2e4e9;">
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <button aria-label="Switch machine or workspace" style="display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 22px; font-weight: 600; color: #16181d;">exosuit
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181d" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span style="font-size: 13px; color: #555b66;">on cube · online · 12 sessions</span>
    </div>
    <button aria-label="New session" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2f55c7; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <div style="display: flex; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e2e4e9;">
    <span style="padding: 8px 14px; border-radius: 18px; background: #eceef2; font-size: 14px;">Group ▾</span>
    <span style="padding: 8px 14px; border-radius: 18px; background: #eceef2; font-size: 14px;">Kind ▾</span>
    <span style="padding: 8px 14px; border-radius: 18px; background: #e8edfb; color: #1f3f9e; font-size: 14px;">Sections: group</span>
  </div>
  <div style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
    <span style="padding: 14px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #3d424b;">11-17-26</span>
    <sc-for list="{{sessions}}" as="s" hint-placeholder-count="5">
      <a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 72px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #eceef2; text-decoration: none; color: #16181d;">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #e8edfb; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f55c7" stroke-width="2" stroke-linecap="round"><path d="M4 6l6 6-6 6M12 18h8"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
          <span style="font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.name}}</span>
          <span style="font-size: 13px; color: #555b66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.last}}</span>
        </span>
        <span style="font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 10px; background: {{s.badgeBg}}; color: {{s.badgeFg}};">{{s.state}}</span>
      </a>
    </sc-for>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e2e4e9; padding: 6px 0 18px;">
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #2f55c7; font-weight: 600;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f55c7" stroke-width="2" stroke-linecap="round"><path d="M4 6l6 6-6 6M12 18h8"/></svg>Sessions</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M3 7h7l2 2h9v10H3z"/></svg>Files</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Search</button>
    <a href="Machines.dc.html" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; color: #555b66; text-decoration: none;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>Machines</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const work = { badgeBg: '#e8edfb', badgeFg: '#1f3f9e' };
    const idle = { badgeBg: '#eceef2', badgeFg: '#3d424b' };
    const warn = { badgeBg: '#fff1dc', badgeFg: '#8a4b00' };
    return { sessions: [
      { name: 'esc not sent to terminal', last: 'OK', state: 'idle', ...idle },
      { name: 'exosuit-haxeon-ui-port', last: 'Waiting on you: run latency…', state: 'idle', ...idle },
      { name: 'suit to exoshot', last: 'Building exohost…', state: 'working', ...work },
      { name: 'exosuit-haxeo-ui-port-2', last: 'Rebased onto main', state: 'idle', ...idle },
      { name: 'docking-chat-1', last: 'Needs your answer', state: 'attention', ...warn }
    ] };
  }
}
</script>
</body>
</html>
