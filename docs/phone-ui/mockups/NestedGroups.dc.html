<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nested groups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f55c7}a:hover{color:#1f3f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f5f7; color: #16181d; font-family: 'IBM Plex Sans', sans-serif;">
  <header style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: #ffffff;">
    <button aria-label="Switch machine or workspace" style="display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 22px; font-weight: 600; color: #16181d;">exosuit
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181d" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span style="font-size: 13px; color: #555b66;">on cube · online · 12 sessions</span>
  </header>
  <div style="display: flex; gap: 8px; padding: 10px 16px 12px; background: #ffffff; border-bottom: 1px solid #e2e4e9;">
    <span style="padding: 8px 14px; border-radius: 18px; background: #16181d; color: #ffffff; font-size: 14px;">11-17-26 ✕</span>
    <span style="padding: 8px 14px; border-radius: 18px; background: #eceef2; font-size: 14px;">Kind ▾</span>
    <span style="padding: 8px 14px; border-radius: 18px; background: #e8edfb; color: #1f3f9e; font-size: 14px;">Sections: group</span>
  </div>
  <div style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
    <button style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; border: 0; background: transparent; font-family: inherit; text-align: left;">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3d424b" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #3d424b; flex-grow: 1;">11-17-26</span>
      <span style="font-size: 12px; color: #555b66;">3</span>
    </button>
    <sc-for list="{{direct}}" as="s" hint-placeholder-count="3">
      <a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #eceef2; text-decoration: none; color: #16181d;">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.name}}</span>
        <span style="font-size: 12px; color: #555b66;">{{s.when}}</span>
      </a>
    </sc-for>
    <button style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; border: 0; background: transparent; font-family: inherit; text-align: left;">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3d424b" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #8a909b;">11-17-26 /</span>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #3d424b; flex-grow: 1;">PHONE APP</span>
      <span style="font-size: 12px; color: #555b66;">2</span>
    </button>
    <sc-for list="{{nested}}" as="s" hint-placeholder-count="2">
      <a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #eceef2; text-decoration: none; color: #16181d;">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.name}}</span>
        <span style="font-size: 12px; color: #555b66;">{{s.when}}</span>
      </a>
    </sc-for>
    <button style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; border: 0; background: transparent; font-family: inherit; text-align: left;">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3d424b" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #8a909b;">11-17-26 /</span>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #3d424b; flex-grow: 1;">RELAY</span>
      <span style="font-size: 12px; color: #555b66;">4 · collapsed</span>
    </button>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e2e4e9; padding: 6px 0 18px;">
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #2f55c7; font-weight: 600;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f55c7" stroke-width="2" stroke-linecap="round"><path d="M4 6l6 6-6 6M12 18h8"/></svg>Sessions</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M3 7h7l2 2h9v10H3z"/></svg>Files</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Search</button>
    <a href="Machines.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; color: #555b66; text-decoration: none;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>Machines</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const idle = { dot: '#9aa0aa' }, work = { dot: '#2f55c7' }, warn = { dot: '#d97706' };
    return {
      direct: [
        { name: 'suit to exoshot', when: 'now', ...work },
        { name: 'esc not sent to terminal', when: '19m', ...idle },
        { name: 'docking-chat-1', when: '2m', ...warn }
      ],
      nested: [
        { name: 'emulator toolchain', when: 'now', ...work },
        { name: 'phoneshell mockups', when: '5m', ...idle }
      ]
    };
  }
}
</script>
</body>
</html>
