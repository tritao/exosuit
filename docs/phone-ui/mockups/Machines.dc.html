<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f55c7}a:hover{color:#1f3f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f5f7; color: #16181d; font-family: 'IBM Plex Sans', sans-serif;">
  <header style="padding: 20px 16px 12px; background: #ffffff; border-bottom: 1px solid #e2e4e9;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600;">Machines</h1>
  </header>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; flex-grow: 1;">
    <section style="background: #ffffff; border-radius: 14px; border: 1px solid #e2e4e9; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #eceef2;">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #1a7f4b;"></span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 600;">cube</span>
        <span style="font-size: 13px; color: #1a6b41;">online</span>
      </div>
      <sc-for list="{{workspaces}}" as="w" hint-placeholder-count="3">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 56px; border-bottom: 1px solid #eceef2; text-decoration: none; color: #16181d;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M3 7h7l2 2h9v10H3z"/></svg>
          <span style="flex-grow: 1; font-size: 16px;">{{w.name}}</span>
          <span style="font-size: 13px; color: #555b66;">{{w.detail}}</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a909b" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </section>
    <section style="background: #ffffff; border-radius: 14px; border: 1px solid #e2e4e9; display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
      <span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid #8a909b; box-sizing: border-box;"></span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span style="font-size: 16px; font-weight: 500;">cube (old pairing)</span>
        <span style="font-size: 13px; color: #a12a2a;">No longer authorized</span>
      </span>
      <button style="height: 40px; padding: 0 14px; border: 1px solid #d5d8de; border-radius: 10px; background: #ffffff; font-family: inherit; font-size: 14px;">Forget</button>
    </section>
    <button style="height: 52px; border: 1px dashed #b3b8c2; border-radius: 14px; background: transparent; font-family: inherit; font-size: 16px; color: #2f55c7; font-weight: 500;">Pair a machine</button>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e2e4e9; padding: 6px 0 18px;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; color: #555b66; text-decoration: none;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M4 6l6 6-6 6M12 18h8"/></svg>Sessions</a>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M3 7h7l2 2h9v10H3z"/></svg>Files</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Search</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #2f55c7; font-weight: 600;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f55c7" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>Machines</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { workspaces: [
      { name: 'exosuit', detail: 'running · 12' },
      { name: 'materia', detail: 'idle' },
      { name: 'nova', detail: 'idle' }
    ] };
  }
}
</script>
</body>
</html>
