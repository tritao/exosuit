<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f55c7}a:hover{color:#1f3f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f5f7; color: #16181d; font-family: 'IBM Plex Sans', sans-serif;">
  <header style="display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 10px; background: #ffffff;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button aria-label="Switch machine or workspace" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 22px; font-weight: 600; color: #16181d;">cube
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181d" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span style="font-size: 14px; color: #555b66;">all workspaces · 14 sessions</span>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #eceef2;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
      <input type="search" placeholder="Search sessions on cube" aria-label="Search sessions" style="border: 0; background: transparent; flex-grow: 1; font-family: inherit; font-size: 15px; outline: none;">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <span style="padding: 7px 12px; border-radius: 16px; background: #eceef2; font-size: 13px; white-space: nowrap;">Workspace ▾</span>
      <span style="padding: 7px 12px; border-radius: 16px; background: #eceef2; font-size: 13px; white-space: nowrap;">Group ▾</span>
      <span style="padding: 7px 12px; border-radius: 16px; background: #eceef2; font-size: 13px; white-space: nowrap;">Kind ▾</span>
      <span style="padding: 7px 12px; border-radius: 16px; background: #e8edfb; color: #1f3f9e; font-size: 13px; white-space: nowrap;">Sections: state</span>
    </div>
  </header>
  <div style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <span style="padding: 14px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: {{sec.color}};">{{sec.title}}</span>
      <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
        <a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 64px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #eceef2; text-decoration: none; color: #16181d;">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{sec.dot}}; flex-shrink: 0;"></span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
            <span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
            <span style="font-size: 13px; color: #555b66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.where}}</span>
          </span>
          <span style="font-size: 12px; color: #555b66;">{{r.when}}</span>
        </a>
      </sc-for>
    </sc-for>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e2e4e9; padding: 6px 0 18px;">
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #2f55c7; font-weight: 600;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f55c7" stroke-width="2" stroke-linecap="round"><path d="M4 6l6 6-6 6M12 18h8"/></svg>Sessions</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><path d="M3 7h7l2 2h9v10H3z"/></svg>Files</button>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-family: inherit; font-size: 12px; color: #555b66;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Search</button>
    <a href="Machines.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; color: #555b66; text-decoration: none;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>Machines</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { sections: [
      { title: 'NEEDS YOU', color: '#8a4b00', dot: '#d97706', rows: [
        { name: 'docking-chat-1', where: 'exosuit · 11-17-26 · Claude', when: '2m' }
      ] },
      { title: 'WORKING', color: '#1f3f9e', dot: '#2f55c7', rows: [
        { name: 'suit to exoshot', where: 'exosuit · 11-17-26 · Claude', when: 'now' },
        { name: 'render pipeline', where: 'materia · Codex', when: 'now' }
      ] },
      { title: 'RECENT', color: '#3d424b', dot: '#9aa0aa', rows: [
        { name: 'esc not sent to terminal', where: 'exosuit · 11-17-26 · Claude', when: '19m' },
        { name: 'exosuit-haxeon-ui-port', where: 'exosuit · 11-17-26 · Claude', when: '1h' },
        { name: 'chat with agent', where: 'exosuit · 11-16-26 · chat', when: '1d' },
        { name: 'build scripts', where: 'nova · terminal', when: '2d' }
      ] }
    ] };
  }
}
</script>
</body>
</html>
